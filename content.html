<!doctype html><html lang="ar-EG" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محتوى الطالب | Dorosak Plus</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#070b16;--panel:#111b30;--line:#ffffff20;--txt:#f3f6fd;--muted:#9fb0cb;--blue:#4c91ff;--mint:#59e0b3;--red:#ff8d8d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(60% 40% at 85% 0,#2455b333,transparent),var(--bg);color:var(--txt);font:14px Cairo,system-ui,sans-serif}.wrap{width:min(1120px,calc(100% - 32px));margin:auto;padding:22px 0}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:26px}.greet{margin:0}.muted{color:var(--muted)}.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:#ffffff0a;color:var(--txt);font:700 14px Cairo;cursor:pointer;text-decoration:none}.profileBtn{width:48px;height:48px;border:0;border-radius:50%;background:linear-gradient(135deg,#4f94ff,#59e0b3);font-weight:900;font-size:19px;cursor:pointer}.headrow{display:flex;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(160deg,#142039,#0d1627);overflow:hidden}.section{display:flex;align-items:center;gap:14px;padding:14px;cursor:pointer;transition:.2s}.section:hover{transform:translateY(-3px);border-color:#4c91ff88}.section img{width:62px;height:62px;object-fit:contain;padding:5px;border-radius:13px;background:#080f1c;flex:none}.sectionInfo{padding:0;min-width:0}.sectionInfo b{font-size:19px}.content{padding:16px}.content img{width:76px;height:76px;object-fit:contain;padding:5px;border-radius:14px;background:#080f1c;margin:0 0 12px}.content h3{margin:0 0 7px}.content p{color:var(--muted);white-space:pre-wrap}.status{padding:14px;color:var(--muted)}.hide{display:none!important}.link{color:#8db9ff;display:inline-block;margin-top:12px}.modal{position:fixed;inset:0;z-index:20;background:#000a;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.profile{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 20px 70px #0009}.profile h2{margin-top:0}.data{padding:12px;border-radius:10px;background:#ffffff08;margin:8px 0}.devices{margin-top:16px}.device{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:8px 0;font-size:12px}
.dataGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.data{display:flex;align-items:center;gap:11px;padding:14px;border-radius:14px;background:linear-gradient(140deg,#ffffff0d,#ffffff04);border:1px solid #ffffff12;margin:0}.dataIcon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#4c91ff20;color:#a8caff;font-size:18px;flex:none}.dataText small{display:block;color:var(--muted);font-size:11px}.dataText b{display:block;overflow-wrap:anywhere}.errorBox{margin:18px 0;border:1px solid #ff8d8d55;background:#451b283d;border-radius:15px;padding:12px}.profile .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
#sections.grid{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:520px){#sections.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.section{padding:11px;gap:9px}.section img{width:48px;height:48px}.sectionInfo b{font-size:15px}}.watch{display:inline-flex;align-items:center;justify-content:center;gap:9px;margin-top:14px;padding:10px 16px;border:1px solid #8ab4ff55;border-radius:12px;background:linear-gradient(135deg,#4c91ff,#315fe0);color:#fff;font-weight:800;text-decoration:none;box-shadow:0 8px 22px #2563eb35;transition:transform .18s,filter .18s}.watch:before{content:"▶";font-size:11px}.watch:hover{filter:brightness(1.12);transform:translateY(-2px)}</style></head><body><main class="wrap">
<header><div><h1 class="greet" id="greeting">أهلًا</h1><div class="muted" id="trackLabel">محتوى شعبتك</div></div><div class="headrow"><span class="muted" id="studentTopName"></span><button id="profileOpen" class="profileBtn" aria-label="الملف الشخصي">ط</button></div></header>
<section id="sectionsView"><h2>الأقسام</h2><p class="muted">اختار القسم لعرض المحتوى الخاص به.</p><div id="sections" class="grid"><p class="status">جاري تحميل الأقسام…</p></div></section>
<section id="itemsView" class="hide"><button id="back" class="btn">رجوع للأقسام</button><h2 id="sectionTitle"></h2><div id="items" class="grid"><p class="status">جاري تحميل المحتوى…</p></div></section><div id="errorBox" class="errorBox hide"><p id="error" class="status"></p><button id="errorLogout" class="btn">رجوع لتسجيل الدخول</button></div></main>
<div id="profileModal" class="modal" role="dialog" aria-modal="true"><section class="profile"><div class="top"><h2>ملف الطالب</h2><button id="profileClose" class="btn">إغلاق</button></div><div id="profileData"></div><div class="devices"><h3>الأجهزة المسجلة</h3><div id="deviceList"></div></div><button id="logout" class="btn" style="margin-top:16px;color:var(--red)">تسجيل الخروج</button></section></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getFirestore,collection,doc,getDoc,onSnapshot,query,where,runTransaction,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
const cfg={apiKey:'AIzaSyDhjhevtzRqW9USY3uVRUPpSWTes3c2oDs',authDomain:'drosak-6736a.firebaseapp.com',projectId:'drosak-6736a',storageBucket:'drosak-6736a.firebasestorage.app',messagingSenderId:'646736939233',appId:'1:646736939233:web:a0ba4ede96be1e597a8fa0',measurementId:'G-721P81KYG9'},db=getFirestore(initializeApp(cfg)),$=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),tracks={science:'علمي علوم',math:'علمي رياضة',literary:'أدبي',azhar:'أزهر',baccalaureate:'بكالوريا'};
const code=sessionStorage.getItem('drosak_student_code'),trackId=sessionStorage.getItem('drosak_student_track');if(!code||!trackId)location.replace('index.html#login');const codeRef=doc(db,'studentCodes',code||'invalid');let student={};
function expireDate(v){return v?.toDate?v.toDate():v?new Date(v):null}function dateText(v){const d=expireDate(v);return d?d.toLocaleString('ar-EG'):'غير محدد'}function deviceName(){const ua=navigator.userAgent;return(/Android/i.test(ua)?'Android':/iPhone|iPad/i.test(ua)?'iPhone / iPad':/Windows/i.test(ua)?'Windows':/Mac/i.test(ua)?'Mac':'متصفح ويب')}
function setGreeting(name){const h=new Date().getHours(),g=h<12?'صباح الخير':h<18?'مساء الخير':'مساء الخير';$('greeting').textContent=`${g}، ${name||'يا بطل'}`;$('studentTopName').textContent=name||'';$('profileOpen').textContent=(name||'ط').trim().charAt(0)}
async function registerDevice(data){const idKey='drosak_device_'+code;let deviceId=localStorage.getItem(idKey);if(!deviceId){deviceId=crypto.randomUUID?crypto.randomUUID():'dev_'+Math.random().toString(36).slice(2)+Date.now();localStorage.setItem(idKey,deviceId)}await runTransaction(db,async tx=>{const snap=await tx.get(codeRef);if(!snap.exists())throw Error('الكود غير موجود.');const c=snap.data(),end=expireDate(c.expiresAt);if(c.active===false)throw Error('الكود موقوف من الإدارة.');if(end&&Date.now()>end.getTime())throw Error('انتهت صلاحية الكود. اطلب تجديده من الإدارة.');const devices={...(c.devices||{})};if(!devices[deviceId]&&Object.keys(devices).length>=Number(c.maxDevices||1))throw Error('وصلت للحد الأقصى للأجهزة المسموح بها. اطلب من الأدمن إلغاء جهاز قديم.');devices[deviceId]={name:deviceName(),userAgent:navigator.userAgent.slice(0,180),seenAt:new Date()};tx.update(codeRef,{devices,lastSeenAt:serverTimestamp()})});}
function showProfile(){const c=student,n=esc(c.studentName||'—'),d=Object.keys(c.devices||{}),field=(icon,label,value)=>`<div class="data"><span class="dataIcon">${icon}</span><span class="dataText"><small>${label}</small><b>${value}</b></span></div>`;$('profileData').innerHTML=`<div class="dataGrid">${field('♙','اسم الطالب',n)}${field('▤','الشعبة',esc(tracks[c.trackId]||'—'))}${field('⌑','كود الطالب',`<span dir="ltr">${esc(code)}</span>`)}${field('⌛','تاريخ الانتهاء',dateText(c.expiresAt))}${field('▣','الأجهزة المستخدمة',`${d.length} من ${Number(c.maxDevices)||1}`)}</div>`;$('deviceList').innerHTML=d.map(id=>`<div class="device"><span>${esc(c.devices[id].name||'جهاز')}</span><span>${dateText(c.devices[id].seenAt)}</span></div>`).join('')||'<span class="muted">لا توجد أجهزة مسجلة.</span>'}
function logout(){sessionStorage.removeItem('drosak_student_code');sessionStorage.removeItem('drosak_student_track');location.href='index.html'}function showError(text){$('errorBox').classList.remove('hide');$('error').textContent=text}$('errorLogout').onclick=logout;$('logout').onclick=logout;$('profileOpen').onclick=()=>{$('profileModal').classList.add('open');showProfile()};$('profileClose').onclick=()=>$('profileModal').classList.remove('open');$('profileModal').onclick=e=>{if(e.target.id==='profileModal')e.currentTarget.classList.remove('open')};
let sections=[],stopSections=null;function loadSections(){if(stopSections||!trackId)return;stopSections=onSnapshot(query(collection(db,'sections'),where('trackId','==',trackId)),snap=>{sections=snap.docs.map(d=>({id:d.id,...d.data()}));$('sections').innerHTML=sections.length?sections.map(s=>`<article class="card section" data-section="${esc(s.id)}">${s.imageUrl?`<img src="${esc(s.imageUrl)}" alt="${esc(s.name)}">`:''}<div class="sectionInfo"><b>${esc(s.name)}</b><div class="muted">اضغط لفتح محتوى القسم ←</div></div></article>`).join(''):'<p class="status">لسه مفيش أقسام مضافة لشعبتك.</p>';document.querySelectorAll('[data-section]').forEach(el=>el.onclick=()=>openSection(el.dataset.section))},e=>{showError('تعذر تحميل الأقسام: '+e.code);console.error(e)})}
if(code&&trackId)getDoc(codeRef).then(async snap=>{if(!snap.exists())throw Error('الكود غير موجود.');student=snap.data();if(student.trackId!==trackId)throw Error('بيانات الكود غير متطابقة.');await registerDevice(student);setGreeting(student.studentName);showProfile();loadSections();onSnapshot(codeRef,s=>{if(!s.exists())return logout();student=s.data();const thisDevice=localStorage.getItem('drosak_device_'+code);if(!student.devices?.[thisDevice])return logout();setGreeting(student.studentName);showProfile();const end=expireDate(student.expiresAt);if(student.active===false||(end&&Date.now()>end.getTime())){showError(student.active===false?'الكود موقوف من الإدارة.':'انتهت صلاحية الكود.');setTimeout(logout,1800)}})}).catch(e=>{showError((e.message||'تعذر التحقق من الكود.')+' لو ظهرت permission-denied، حدّث قواعد Firestore بالنسخة المرفقة.');console.error(e)});
function getYoutubeId(value){try{const u=new URL(value),host=u.hostname.toLowerCase();if(host==='youtu.be'||host.endsWith('.youtu.be'))return u.pathname.split('/').filter(Boolean)[0]||'';if(host==='youtube.com'||host.endsWith('.youtube.com')){if(u.searchParams.get('v'))return u.searchParams.get('v');const p=u.pathname.split('/').filter(Boolean);if(['embed','shorts','live','v'].includes(p[0]))return p[1]||''}}catch(e){}return''}
let stopItems=null,itemsRequest=0;const contentCache=new Map();function renderItemRows(rows){return rows.length?rows.map(x=>{const isVideo=x.kind==='video',ytId=isVideo?getYoutubeId(x.url||''):'',href=isVideo?`player.html?${ytId?'yt='+encodeURIComponent(ytId):'url='+encodeURIComponent(x.url||'')}&title=${encodeURIComponent(x.title||'فيديو')}`:esc(x.url||'');return `<article class="card content">${x.imageUrl?`<img loading="lazy" src="${esc(x.imageUrl)}" alt="${esc(x.title)}">`:''}<h3>${esc(x.title)}</h3>${x.description?`<p>${esc(x.description)}</p>`:''}${x.url?`<a class="link watch" href="${href}" ${isVideo?'':'target="_blank" rel="noopener"'}>${isVideo?'مشاهدة داخل الموقع':x.kind==='file'?'فتح الملف':'فتح الرابط'}</a>`:''}</article>`}).join(''):'<p class="status">القسم ده لسه مفيهوش محتوى.</p>'}function openSection(id){const s=sections.find(x=>x.id===id);if(!s)return;const request=++itemsRequest;$('sectionTitle').textContent=s.name;$('sectionsView').classList.add('hide');$('itemsView').classList.remove('hide');const cached=contentCache.get(id);$('items').innerHTML=cached?renderItemRows(cached):'<p class="status">جاري تحميل محتوى القسم…</p>';if(stopItems){stopItems();stopItems=null}stopItems=onSnapshot(query(collection(db,'publicContent'),where('sectionId','==',id)),snap=>{if(request!==itemsRequest)return;const rows=snap.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));contentCache.set(id,rows);$('items').innerHTML=renderItemRows(rows)},e=>{if(request!==itemsRequest)return;$('items').innerHTML=`<p class="status">تعذر تحميل محتوى القسم (${esc(e.code)}). راجع قواعد Firestore والاتصال.</p>`;console.error(e)})}
$('back').onclick=()=>{$('itemsView').classList.add('hide');$('sectionsView').classList.remove('hide');if(stopItems){stopItems();stopItems=null}};
</script></body></html>
